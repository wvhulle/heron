when:
  - event: [push, pull_request, manual, tag]

steps:
  - name: flake-check
    image: nixos/nix:2.34.9
    environment:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = true
        sandbox = false
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_auth_token
    commands:
      - |
        if [ -n "$${CACHIX_AUTH_TOKEN}" ]; then
          nix run --inputs-from . nixpkgs#cachix -- watch-exec wvhulle -- nix flake check -L --keep-going
        else
          nix flake check -L --keep-going
        fi
