when:
  - event: [push, pull_request, manual, tag]

variables:
  - &build_flake_check_named_after_step
    image: nixos/nix:2.34.9
    environment:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = true
        sandbox = false
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_auth_token
    commands:
      - |
        check=".#checks.x86_64-linux.$${CI_STEP_NAME}"
        if [ -n "$${CACHIX_AUTH_TOKEN}" ]; then
          nix run --inputs-from . nixpkgs#cachix -- watch-exec wvhulle -- nix build -L --no-link "$check"
        else
          nix build -L --no-link "$check"
        fi

steps:
  - name: rules
    <<: *build_flake_check_named_after_step
  - name: developer-tools
    <<: *build_flake_check_named_after_step
  - name: rule-hygiene
    <<: *build_flake_check_named_after_step
  - name: lakefile-setup-build-and-lint
    <<: *build_flake_check_named_after_step
  - name: lakefile-setup-cold-build
    <<: *build_flake_check_named_after_step
  - name: lakefile-setup-editor
    <<: *build_flake_check_named_after_step
  - name: per-file-import-build
    <<: *build_flake_check_named_after_step
  - name: per-file-import-editor
    <<: *build_flake_check_named_after_step
  - name: no-project-changes-scan
    <<: *build_flake_check_named_after_step
  - name: no-project-changes-editor
    <<: *build_flake_check_named_after_step
